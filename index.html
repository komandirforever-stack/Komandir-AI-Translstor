<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Переводчик RU ⇄ PT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
        #settings { background: #1e1e1e; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        input[type="password"] { padding: 8px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        button, select { padding: 8px 15px; border-radius: 5px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #0056b3; }
        .chat-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        .inverted { transform: rotate(180deg); background: #1a2a3a; border-bottom: 2px solid #000; }
        .normal { background: #2a1a1a; }
        .status { font-size: 1.2rem; margin-bottom: 15px; color: #aaa; }
        .transcript { font-size: 1.5rem; text-align: center; min-height: 60px; margin-bottom: 20px; }
        .action-btn { width: 120px; height: 120px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.2s; background: #444; color: white; border: none; }
        .active-mic { background: #dc3545; box-shadow: 0 0 20px #dc3545; }
        #controller { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; padding: 10px; border-radius: 10px; border: 2px solid #555; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="settings">
        <input type="password" id="apiKey" placeholder="Google AI API Key">
        <select id="modeSelect">
            <option value="auto">Режим: Автобеседа (Hands-free)</option>
            <option value="ptt">Режим: Рация (Push-to-Talk)</option>
        </select>
        <button id="connectBtn">Подключить</button>
    </div>

    <div id="pt-zone" class="chat-zone inverted">
        <div class="status" id="pt-status">Aguardando...</div>
        <div class="transcript" id="pt-text">Tradução aparecerá aqui</div>
        <button class="action-btn" id="pt-btn">Falar</button>
    </div>

    <div id="controller">
        <div style="font-size: 0.8rem; color: #888;">Очередь</div>
        <button id="switchQueueBtn">Сменить ход 🔄</button>
    </div>

    <div id="ru-zone" class="chat-zone normal">
        <div class="status" id="ru-status">Ожидание...</div>
        <div class="transcript" id="ru-text">Здесь будет перевод</div>
        <button class="action-btn" id="ru-btn">Говорить</button>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        apiKeyInput.value = localStorage.getItem('geminiApiKey') || '';
        apiKeyInput.addEventListener('change', () => localStorage.setItem('geminiApiKey', apiKeyInput.value));

        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let currentMode = 'auto'; 
        let currentQueue = 'ru'; 

        const connectBtn = document.getElementById('connectBtn');
        const modeSelect = document.getElementById('modeSelect');
        const ruBtn = document.getElementById('ru-btn');
        const ptBtn = document.getElementById('pt-btn');
        const switchQueueBtn = document.getElementById('switchQueueBtn');

        const SYSTEM_INSTRUCTION = "Ты синхронный переводчик. Пара: русский и европейский португальский (pt-PT). Строго запрещена бразильская фонетика и лексика. Переводи коротко, точно и разговорно. Если язык оригинала русский - отвечай на португальском. Если португальский - отвечай на русском.";

        modeSelect.addEventListener('change', (e) => {
            currentMode = e.target.value;
            switchQueueBtn.style.display = currentMode === 'auto' ? 'block' : 'none';
            updateUI();
        });

        switchQueueBtn.addEventListener('click', () => {
            currentQueue = currentQueue === 'ru' ? 'pt' : 'ru';
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ clientContent: { turnComplete: true } }));
            }
            updateUI();
        });

        function updateUI() {
            ruBtn.classList.remove('active-mic');
            ptBtn.classList.remove('active-mic');
            
            if (currentMode === 'auto') {
                if (currentQueue === 'ru') {
                    document.getElementById('ru-status').innerText = 'СЛУШАЮ: РУССКИЙ...';
                    document.getElementById('pt-status').innerText = 'Aguardando...';
                    ruBtn.classList.add('active-mic');
                } else {
                    document.getElementById('pt-status').innerText = 'OUVINDO: PORTUGUÊS...';
                    document.getElementById('ru-status').innerText = 'Ожидание...';
                    ptBtn.classList.add('active-mic');
                }
            } else {
                document.getElementById('ru-status').innerText = 'Нажмите и держите (Рация)';
                document.getElementById('pt-status').innerText = 'Pressione e segure (PTT)';
            }
        }

        function floatTo16BitPCM(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return output;
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        async function startAudioCapture() {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: { noiseSuppression: true, echoCancellation: true, sampleRate: 16000 }
            });
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            if (audioContext.state === 'suspended') await audioContext.resume();
            
            const source = audioContext.createMediaStreamSource(mediaStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            
            source.connect(processor);
            processor.connect(audioContext.destination);
            
            processor.onaudioprocess = (e) => {
                if (!mediaStream.getAudioTracks()[0].enabled || !ws || ws.readyState !== WebSocket.OPEN) return;
                
                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = floatTo16BitPCM(inputData);
                const base64Audio = arrayBufferToBase64(pcm16.buffer);
                
                ws.send(JSON.stringify({
                    realtimeInput: {
                        mediaChunks: [{
                            mimeType: "audio/pcm;rate=16000",
                            data: base64Audio
                        }]
                    }
                }));
            };
            
            setMicState(false); 
        }

        function setMicState(enabled) {
            if (mediaStream) {
                mediaStream.getAudioTracks().forEach(track => { track.enabled = enabled; });
            }
        }

        function connectWebSocket() {
            const key = apiKeyInput.value;
            if (!key) return alert("Введите реальный API ключ");
            
            const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${key}`;
            ws = new WebSocket(url);
            
            ws.onopen = () => {
                connectBtn.innerText = "Подключено";
                connectBtn.style.background = "#28a745";
                
                ws.send(JSON.stringify({
                    setup: {
                        model: "models/gemini-2.0-flash-exp",
                        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                        generationConfig: {
                            responseModalities: ["AUDIO"] 
                        }
                    }
                }));
            };
            
            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.serverContent && msg.serverContent.modelTurn) {
                    const parts = msg.serverContent.modelTurn.parts;
                    parts.forEach(part => {
                        if (part.text) {
                            document.getElementById('ru-text').innerText = part.text;
                            document.getElementById('pt-text').innerText = part.text;
                        }
                        if (part.inlineData && part.inlineData.data) {
                            playAudio(part.inlineData.data);
                        }
                    });
                }
            };
            
            ws.onerror = (e) => console.error("WebSocket ошибка", e);
        }

        async function playAudio(base64Data) {
            setMicState(false); 
            
            const binary = window.atob(base64Data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) { 
                bytes[i] = binary.charCodeAt(i); 
            }
            
            const int16Array = new Int16Array(bytes.buffer);
            const audioBuffer = audioContext.createBuffer(1, int16Array.length, 24000);
            const channelData = audioBuffer.getChannelData(0);
            
            for (let i = 0; i < int16Array.length; i++) {
                channelData[i] = int16Array[i] / 32768.0;
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            
            source.onended = () => {
                if (currentMode === 'auto') {
                    currentQueue = currentQueue === 'ru' ? 'pt' : 'ru';
                    updateUI();
                }
            };
            source.start();
        }

        connectBtn.addEventListener('click', async () => {
            if (!audioContext) await startAudioCapture();
            connectWebSocket();
            updateUI();
        });

        const bindPTT = (btn) => {
            const startMic = (e) => { 
                e.preventDefault(); 
                if (currentMode === 'ptt') { 
                    setMicState(true); 
                    btn.classList.add('active-mic'); 
                }
            };
            const stopMic = (e) => { 
                e.preventDefault(); 
                if (currentMode === 'ptt') { 
                    setMicState(false); 
                    btn.classList.remove('active-mic'); 
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ clientContent: { turnComplete: true } }));
                    }
                }
            };
            btn.addEventListener('mousedown', startMic); btn.addEventListener('mouseup', stopMic);
            btn.addEventListener('touchstart', startMic); btn.addEventListener('touchend', stopMic);
        };

        bindPTT(ruBtn);
        bindPTT(ptBtn);
    </script>
</body>
</html>
